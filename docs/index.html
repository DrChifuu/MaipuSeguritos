<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Maipo Vigía: lluvia medida por la comunidad y estado de los caminos del Cajón del Maipo. Tablero comunitario, registro de observadores y archivos históricos." />
  <meta name="color-scheme" content="light" />
  <title>Maipo Vigía — Lluvia y caminos en el Cajón del Maipo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2.5C12 2.5 6 9.5 6 14a6 6 0 0 0 12 0c0-4.5-6-11.5-6-11.5Z' fill='none' stroke='%230E6474' stroke-width='2'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/maipo.css" />
  <script src="datos/config.js" defer></script>
  <script src="datos/semilla.js" defer></script>
  <script src="assets/almacen.js" defer></script>
  <script src="assets/maipo.js" defer></script>
</head>
<body>
  <a href="#mainPanel" class="skip-link">Saltar al contenido principal</a>
  <div class="app-shell" id="appShell">
    <!-- BARRA SUPERIOR -->
    <header class="topbar" role="banner">
      <div class="topbar-left">
        <button type="button" class="brand-mark" id="brandBtn" aria-label="Maipo Vigía, ir a Ahora">
          <svg class="icon-24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M12 2.5C12 2.5 6 9.5 6 14a6 6 0 0 0 12 0c0-4.5-6-11.5-6-11.5Z"/>
            <path d="M9.5 14.5a2.5 2.5 0 0 0 2.5 2.5"/>
          </svg>
          <span>Maipo Vigía</span>
        </button>
        <span class="topbar-updated" id="topbarUpdated">Actualizado hoy a las 09:42</span>
        <span class="topbar-mobile-status" id="topbarMobileStatus"></span>
      </div>
      <div class="topbar-right">
        <button type="button" class="topbar-btn" id="btnFontToggle" aria-pressed="false" aria-label="Agrandar letra">A+</button>
        <div class="desktop-session-wrap" id="desktopSessionWrap"></div>
      </div>
    </header>

    <div class="offline-banner hidden" id="offlineBanner" role="status">
      Sin conexión: se muestran los datos guardados en este equipo.
    </div>

    <!-- NIVEL 1: BARRA DE PESTAÑAS (ESCRITORIO) -->
    <nav class="tabbar" id="desktopTabbar" role="tablist" aria-label="Secciones principales"></nav>

    <!-- NIVEL 2: SOLAPAS -->
    <nav class="subtabbar" id="subtabbar" role="tablist" aria-label="Solapas de sección"></nav>

    <!-- CONTENIDO PRINCIPAL (ÚNICO SCROLL INTERNO) -->
    <main class="main-panel" id="mainPanel" tabindex="-1">
      <div class="content-container" id="mainContent"></div>
    </main>

    <!-- PIE DE ESCRITORIO -->
    <footer class="footerbar" role="contentinfo">
      <div class="footer-left">
        <span>El semáforo es apoyo comunitario, no alerta oficial.</span>
        <span class="demo-tag" id="demoTag">Datos de ejemplo</span>
      </div>
      <div class="footer-right">
        <button type="button" class="footer-link" id="btnFooterHelp">Cómo leer</button>
        <button type="button" class="footer-link" id="btnFooterKiosco">Kiosco</button>
      </div>
    </footer>

    <!-- BARRA INFERIOR MÓVIL (5 BOTONES SEGÚN ROL) -->
    <nav class="bottombar" id="mobileBottombar" aria-label="Navegación móvil"></nav>
  </div>

  <!-- NIVEL 3: HOJA LATERAL (480px ESCRITORIO / PANTALLA COMPLETA MÓVIL) -->
  <div class="sheet-backdrop hidden" id="sheetBackdrop" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-panel" id="sheetPanel">
      <div class="sheet-head">
        <h2 class="sheet-title" id="sheetTitle">Panel</h2>
        <button type="button" class="topbar-btn" id="btnCloseSheet" aria-label="Cerrar panel">Cerrar</button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>
  </div>

  <!-- MODO KIOSCO (1920×1080) -->
  <section class="kiosco-overlay hidden" id="kioscoOverlay" aria-label="Modo Kiosco">
    <div class="kiosco-top">
      <button type="button" class="kiosco-brand" id="kioscoBrandExit" title="Cinco toques para salir">Maipo Vigía</button>
      <div id="kioscoTopInfo" style="font-size: 24px; color: var(--pantalla-suave);"></div>
    </div>
    <div class="kiosco-grid" id="kioscoGrid"></div>
    <div class="kiosco-foot">
      <span id="kioscoClock"></span>
      <span id="kioscoFootMode"></span>
      <span>Datos de ejemplo · El semáforo es apoyo comunitario, no alerta oficial</span>
    </div>
  </section>

  <!-- MENSAJE EMERGENTE ACCESIBLE (REEMPLAZA alert()) -->
  <div class="toast-box hidden" id="toastBox" role="status" aria-live="polite"></div>

  
</body>
</html>
